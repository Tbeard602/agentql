version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/examples/js"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/examples/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
